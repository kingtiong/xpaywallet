// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "31.0.0"
        minSdkVersion = 21
        compileSdkVersion = 33
        targetSdkVersion = 33

        if (System.properties['os.arch'] == "aarch64") {
            // For M1 Users we need to use the NDK 24 which added support for aarch64
            ndkVersion = "24.0.8215888"
        } else {
            // Otherwise we default to the side-by-side NDK version from AGP.
            ndkVersion = "21.4.7075529"
        }
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:7.2.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("de.undercouch:gradle-download-task:5.0.1")
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url("$rootDir/../node_modules/react-native/android")
        }
        maven {
            // Android JSC is installed from npm
            url("$rootDir/../node_modules/jsc-android/dist")
        }
        mavenCentral {
            // We don't want to fetch react-native from Maven Central as there are
            // older versions over there.
            content {
                excludeGroup "com.facebook.react"
            }
        }
        google()
        maven { url 'https://www.jitpack.io' }
    }
}

/**
 * Gradle task validation (Gradle 7+) can fail builds when a task reads another task's outputs
 * without declaring a dependency. Some React Native codegen tasks (notably in
 * `react-native-sensitive-info`) can end up reading build outputs from other native modules,
 * which triggers "implicit dependency" validation errors during Release builds.
 *
 * We make that dependency explicit by wiring `generateCodegenSchemaFromJavaScript` to run after
 * common Release-variant producer tasks in other library modules. We intentionally exclude `:app`
 * here to avoid any potential task graph cycles (the app depends on libraries).
 */
gradle.projectsEvaluated {
    def sensitiveInfoProject = rootProject.findProject(':react-native-sensitive-info')
    if (sensitiveInfoProject == null) {
        return
    }

    def producerTaskNamePatterns = [
            ~/^process.*ReleaseManifest$/,
            ~/^sync.*ReleaseLibJars$/,
            ~/^compile.*Release(JavaWithJavac|Kotlin)$/,
            ~/^copy.*ReleaseJniLibsProjectAndLocalJars$/,
            ~/^generate.*Release(BuildConfig|ResValues)$/,
            ~/^merge.*Release(JavaResource|JniLibFolders|NativeLibs|Shaders)$/,
            ~/^package.*Release(Assets|Resources)$/,
            ~/^externalNativeBuildRelease$/,
            ~/^stripReleaseDebugSymbols$/,
            ~/^buildCMakeRelWithDebInfo.*$/,
    ]

    sensitiveInfoProject.tasks.matching { it.name == 'generateCodegenSchemaFromJavaScript' }.configureEach { codegenTask ->
        def producerProjects = rootProject.subprojects.findAll { p ->
            p != sensitiveInfoProject && p.path != ':app'
        }

        def deps = producerProjects.collect { p ->
            p.tasks.matching { t ->
                def n = t.name
                producerTaskNamePatterns.any { pat -> (n ==~ pat) }
            }
        }

        codegenTask.dependsOn(deps)
    }
}
